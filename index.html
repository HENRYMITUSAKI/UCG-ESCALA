<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10293e" />
  <meta name="description" content="Protótipo local de distribuição diária de pacientes por escalas de enfermagem." />
  <title>Escala de Enfermagem · v1.9 · Distribuição Diária</title>
  <style>
:root{color-scheme:light;--navy:#10293e;--navy-2:#193c55;--teal:#087b7c;--teal-soft:#e8f7f5;--blue:#236398;--bg:#f3f6f9;--surface:#fff;--surface-2:#f8fafc;--ink:#173247;--muted:#647689;--line:#dce4eb;--rose:#ab4c59;--rose-soft:#fff0f1;--amber:#9a6312;--amber-soft:#fff5df;--green:#1b7a62;--green-soft:#e7f6ef;--shadow:0 8px 28px rgba(21,48,69,.055)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--blue)}
.app-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy);color:#d8e7ef;padding:30px 17px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;margin:0 8px 35px}
.brand-icon{width:43px;height:43px;border-radius:12px;background:#1b536b;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #3d6c80;color:#b8f0e9;font-size:22px}
.brand strong{display:block;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;letter-spacing:-.3px}
.brand span{font-size:11px;color:#b0c9d6;letter-spacing:.02em}
.nav-title{margin:8px 15px 12px;color:#7da4b9;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.13em}
.nav{display:grid;gap:6px}
.nav-btn{width:100%;background:transparent;border:0;color:#bbd0db;border-radius:10px;padding:11px 12px;text-align:left;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600}
.nav-btn:hover{background:#20425a;color:#fff}.nav-btn.active{background:#25546a;color:#fff;box-shadow:inset 3px 0 0 #6de1cf}
.nav-icon{font-size:17px;width:24px;text-align:center}
.sidebar-foot{margin-top:auto;border-top:1px solid #365469;padding:18px 10px 0;color:#a6c3d0;font-size:11px}
.sidebar-foot strong{color:#e4f5f5;display:block;margin-bottom:5px}.sidebar-foot p{margin:0}
.workspace{min-width:0;padding:28px clamp(18px,3vw,49px) 45px;max-width:1650px;width:100%;margin:auto}
.topline{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:26px}
.crumb{color:#738698;font-size:12px;letter-spacing:.03em}.crumb strong{color:#254b64}
.demo-flag{background:#e3f0f8;color:#356e92;border-radius:30px;font-size:10px;letter-spacing:.07em;font-weight:800;padding:7px 11px}
.page-header{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{text-transform:uppercase;color:#087d81;font-size:11px;font-weight:800;letter-spacing:.15em;margin:0 0 5px}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',Arial,sans-serif;line-height:1.3;letter-spacing:-.032em}
h1{margin:0;font-size:clamp(24px,2.4vw,34px);font-weight:800}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0}
.subtitle{color:var(--muted);margin:6px 0 0;max-width:670px}
.toolbar-actions,.row-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:12px;transition:transform .12s,background .12s;white-space:nowrap}
.btn:hover{background:#f3f9fb;transform:translateY(-1px)}
.btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn-primary:hover{background:#086d6e;color:#fff}
.btn-dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-dark:hover{background:#204661;color:#fff}
.btn-danger{border-color:#f1c7cc;background:var(--rose-soft);color:var(--rose)}
.btn-quiet{border:0;background:transparent;padding:8px 10px}.btn-sm{padding:7px 10px;font-size:11px;border-radius:8px}
.control-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:19px}
.controls-left{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.label-field{display:grid;gap:5px;font-size:11px;color:var(--muted);font-weight:700}
.control,.text-input,.mini-select{outline:none;border:1px solid #d7e2e9;border-radius:9px;background:#fff;color:var(--ink);padding:9px 11px;min-width:135px}
.control:focus,.text-input:focus,.mini-select:focus{border-color:#0c9795;box-shadow:0 0 0 3px #d6f2ef}
.text-input{width:100%}.mini-select{min-width:unset;width:100%;padding:7px 8px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.metric-head{display:flex;justify-content:space-between;align-items:center;color:#698092;font-weight:700;font-size:11px;gap:5px}
.metric-icon{font-size:18px;color:var(--teal)}
.metric-value{font-size:29px;line-height:1.3;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;margin:8px 0 2px}
.metric-foot{font-size:11px;color:#8899a8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel-header{padding:21px 23px 17px;display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap;border-bottom:1px solid #ecf0f3}
.panel-body{padding:20px 23px}.panel-subtitle{margin:4px 0 0;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 9px;background:#edf4f8;color:#41657b;font-size:11px;font-weight:800;white-space:nowrap}
.pill-teal{background:var(--teal-soft);color:#137b74}.pill-amber{background:var(--amber-soft);color:var(--amber)}.pill-red{background:var(--rose-soft);color:var(--rose)}.pill-green{background:var(--green-soft);color:var(--green)}
.notice{border:1px solid #c4e8e4;background:#effbfa;color:#196a6b;padding:13px 15px;border-radius:11px;display:flex;gap:9px;align-items:start;margin-bottom:18px;font-size:12px}
.notice.warning{border-color:#f4d8a6;background:#fff9ed;color:#81550f}.notice.error{border-color:#f3c0c9;background:#fff4f5;color:#933947}
.notice strong{font-weight:800}.notice ul{margin:7px 0 0;padding-left:17px}
.empty{padding:39px 25px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:7px}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:800px}
th,td{text-align:left;padding:13px 13px;vertical-align:middle;border-bottom:1px solid #eaf0f3;font-size:12px}
th{color:#617688;font-size:10px;letter-spacing:.07em;text-transform:uppercase;background:#f7fafb;font-weight:800}
tr:last-child td{border-bottom:0}.person-title{font-weight:800;color:var(--ink);display:block}.person-meta{color:#81909d;font-size:10px}
.assignments{display:flex;gap:5px;flex-wrap:wrap;align-items:center;max-width:370px}
.bed-tag{border:1px solid #bcdedc;background:#f0faf8;color:#216e6c;padding:5px 7px;font-size:11px;font-weight:800;border-radius:7px;white-space:nowrap}
button.bed-tag:hover{background:#d9f4ef;border-color:#50b6a8}
.bed-tag.bed-iso{background:#fff7e7;border-color:#f0dcae;color:#8b5d1d}
.text-muted{color:#8796a3}.num{font-variant-numeric:tabular-nums;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.empty-assignment{border:1px dashed #d5e4ec;background:#fafcfd;padding:17px;border-radius:10px;color:var(--muted);text-align:center}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.report-col{padding:18px 18px;background:#fbfcfe;border:1px solid #e4ebf1;border-radius:12px}
.report-col h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.report-line{padding:9px 0;border-top:1px solid #e6edf1}
.report-line:first-of-type{border-top:0}
.report-line strong{font-size:11px;display:block;margin-bottom:3px}
.report-line .ids{font-size:12px;color:#4c687c;line-height:1.75;overflow-wrap:anywhere}
.report-line.vacant strong{color:#457e88}.report-line.blocked strong{color:#986c34}.report-line.isolation strong{color:#a64c5c}
.section-kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.beds-toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.beds-toolbar input{max-width:230px}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:13px}
.room-card{border:1px solid #dfe8ed;border-radius:12px;background:#fff;overflow:hidden}
.room-heading{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f6fafb;border-bottom:1px solid #e9eff2}
.room-heading h4{font-size:14px;margin:0}.room-heading small{font-size:11px;color:#79909b}
.bed-editor{padding:12px 13px;border-bottom:1px solid #e9eef1}.bed-editor:last-child{border-bottom:0}
.bed-editor-top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:9px}.bed-editor-top strong{font-size:12px}
.bed-editor-top select{width:70%;max-width:185px}
.bed-editor.hollow{background:#f7f9fb}.bed-editor.isolated-locked{background:#fff6f6}
.bed-editor.flags{padding:0}.flag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.checkline{font-size:11px;color:#435e70;display:flex;align-items:center;gap:6px;font-weight:600}
.checkline input{accent-color:var(--teal);width:15px;height:15px;margin:0}
.bed-details{display:grid;gap:9px}.bed-details select{margin-top:2px}
.inline-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.staff-list{display:grid;gap:11px}
.staff-card{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:65px minmax(165px,1.2fr) minmax(135px,.7fr) minmax(220px,1.2fr) auto;gap:14px;align-items:center;background:#fff}
.staff-card.inactive{background:#fafbfc;opacity:.75}
.staff-number{background:#e8f4f6;color:#236b7b;border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:18px}
.staff-number small{font-size:9px;text-transform:uppercase;letter-spacing:.07em;display:block}
.staff-rules{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.status-toggle{display:flex;gap:7px;align-items:center;white-space:nowrap;font-weight:700;font-size:11px}
.status-toggle input{width:16px;height:16px;accent-color:var(--teal)}
.staff-controls{display:grid;gap:7px}.staff-controls .label-field{min-width:100px}
.form-note{font-size:11px;color:#758895}
.legend{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.legend span{font-size:11px;color:var(--muted)}
.rule-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.rule-item{padding:16px;border:1px solid var(--line);background:#fbfdfd;border-radius:11px}
.rule-item strong{font-size:12px;display:block;margin-bottom:6px}.rule-item p{color:#698091;margin:0;font-size:12px}
.timeline{display:grid;gap:10px}.timeline-item{display:flex;gap:15px;justify-content:space-between;align-items:center;background:#fbfcfd;border:1px solid var(--line);border-radius:11px;padding:14px}
.timeline-item strong{display:block;font-size:13px}.timeline-item span{color:var(--muted);font-size:11px}
.footer-note{font-size:11px;color:#8a9baa;line-height:1.7;text-align:center;margin:23px 0 0}
.modal-overlay{position:fixed;z-index:20;inset:0;background:rgba(8,24,37,.62);display:grid;place-items:center;padding:15px}
.modal{width:min(100%,520px);max-height:min(90vh,800px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.2)}
.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between}
.modal-head h2{font-size:17px}.modal-body{padding:20px 23px;display:grid;gap:14px}.modal-foot{padding:16px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-close{border:0;background:#f2f5f7;border-radius:8px;font-size:22px;width:31px;height:31px;color:#65788a}
.modal-help{font-size:12px;color:var(--muted)}
.toast{position:fixed;z-index:35;right:24px;bottom:24px;background:#15384b;color:#fff;box-shadow:0 15px 40px #0002;padding:13px 17px;border-radius:11px;font-weight:700;font-size:12px;max-width:440px}
.toast.error{background:#973c4f}
.split-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.print-only{display:none}
@media(max-width:1150px){.staff-card{grid-template-columns:60px 1fr 1fr;gap:11px}.staff-rules{grid-column:2 / 4}.staff-actions{grid-column:2/4}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.app-shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:12px 16px}.brand{margin:0 0 9px}.nav-title,.sidebar-foot{display:none}.nav{display:flex;overflow:auto;padding-bottom:1px}.nav-btn{width:auto;white-space:nowrap}.workspace{padding:19px 14px 28px}.topline{margin-bottom:16px}.page-header{align-items:start;gap:13px}.toolbar-actions{width:100%}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.report-grid,.rule-list{grid-template-columns:1fr}.staff-card{grid-template-columns:55px 1fr}.staff-controls,.staff-rules,.staff-actions{grid-column:1 / -1}.staff-rules{grid-template-columns:1fr 1fr}.staff-card .label-field{min-width:0}}
@media(max-width:460px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:11px}.metric-value{font-size:23px}.page-header h1{font-size:24px}.control-bar{padding:13px}.controls-left{width:100%}.controls-left .label-field{flex:1}.control{width:100%;min-width:0}.room-grid{grid-template-columns:1fr}.panel-header,.panel-body{padding:15px}.btn{padding:9px 11px}.staff-rules{grid-template-columns:1fr}}

/* Revisão e personalização antes de imprimir */
.review-cta{justify-content:flex-end;margin:0 0 16px}
.review-actions{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:7px 0 16px}
.review-actions .form-note{max-width:460px}
.edit-table{min-width:710px}
.edit-table td:nth-child(1){width:90px}
.edit-table td:nth-child(2){width:90px}
.edit-table td:nth-child(4){width:75px}
.edit-table td:last-child{width:260px}
.edit-table tr:hover{background:#f8fbfc}
.edit-select{width:100%;min-width:210px;font-weight:700}
.print-editor-fields{display:grid;gap:17px;max-width:800px}
.print-editor-fields textarea{min-height:90px;line-height:1.55;resize:vertical}
.print-editor-fields .checkline{width:max-content;max-width:100%;font-size:12px}
.print-observations .panel-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6}


/* v1.4 — acréscimo/transferência livre antes da impressão */
.manual-add-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:14px;border:1px dashed #b8dcd8;border-radius:11px;background:#f5fbfa;margin:8px 0 9px}
.manual-add-form .label-field{min-width:190px;flex:1}
.manual-add-form .btn{min-height:34px}

.print-manual-note{margin:9px 0;padding:8px 12px;border:1px solid #dbbd79;background:#fff9e9;color:#684b1a;font-size:10px;line-height:1.45}

/* Edição direta e preenchimento rápido */
.destination{border:0;background:none;text-align:left;padding:8px 0;color:inherit;font:inherit;font-weight:700;cursor:pointer}.destination:hover{text-decoration:underline;color:#087e83}
.bed-tag[draggable]{cursor:grab;min-height:36px}.bed-tag[aria-pressed="true"]{outline:3px solid #087e83;background:#d7f5ee}.drop-row:hover{background:#f0faf8}.drop-row td{min-height:65px}
details.panel>summary{padding:18px;cursor:pointer;font-weight:600}.status-buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:10px 0}.status-choice{border:1px solid #ccd6dc;border-radius:7px;padding:8px 4px;background:#fff;color:#435565;cursor:pointer;font-size:11px;min-height:36px}.status-choice.chosen{background:#0a7479;border-color:#0a7479;color:#fff;font-weight:700}.batch-check{font-size:11px;color:#536575}.batch-toolbar{background:#fff;border:1px solid #ccd6dc;border-radius:12px;padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.batch-toolbar .row-actions{width:100%;flex-wrap:wrap}.bed-extra summary{cursor:pointer;color:#087e83;font-size:12px;padding:10px 0}.bed-extra .flag-grid{margin-top:8px}.bed-details .flag-grid{align-items:center}.bed-details small{font-size:10px}.bed-details input[type=number]{width:100%;min-width:0}.room-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.bed-editor-top{gap:8px}.review-actions{margin:18px 0;gap:12px;flex-wrap:wrap;display:flex;align-items:center}


.pending-assignment{display:flex;gap:12px;padding:12px;border:1px solid #dfb7a0;border-radius:8px;background:#fff7ed}.pending-assignment .bed-tag{margin:6px 4px 0 0}

/* Leitos juntos por quarto, mantendo A e B como destinos individuais. */
.person-title.destination{font-size:16px;line-height:1.3;padding:3px 0;overflow-wrap:anywhere}
.person-meta{display:block;margin-top:4px}
#schedule-panel table{min-width:660px}
#schedule-panel th:first-child{width:25%}
#schedule-panel th:nth-child(2){width:43%}
#schedule-panel td:nth-child(n+3){text-align:center}
.schedule-beds .assignments{max-width:none}
.post-bed-line{display:flex;align-items:center;gap:8px;margin:4px 0}
.post-letter{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:5px;background:#e5edf3;color:#3b566b;font-size:11px;font-weight:800}
.room-bed-group{display:inline-flex;align-items:center;border:1px solid #bcdedc;border-radius:7px;background:#f0faf8;color:#216e6c;white-space:nowrap;gap:0;overflow:visible}
.room-bed-number{font-size:12px;font-weight:800;padding:0 5px 0 8px}
.room-bed-group .bed-tag{border:0;border-left:1px solid #cde4e0;border-radius:0;padding:5px 6px}
.room-bed-group .bed-tag:last-child{border-radius:0 6px 6px 0}
.bed-tag.bed-prep{background:#f2edfc;color:#64428f}
.prep-marker{display:inline!important;margin:0!important;font-size:9px!important;font-weight:800;color:inherit!important}
.nurse-panel{border:1px solid #8eb3c5}
.nurse-panel .panel-header{background:#f2f8fb}
.nurse-table{min-width:720px}
.nurse-table th:first-child{width:26%}.nurse-table th:nth-child(2){width:38%}.nurse-table th:nth-child(3){width:27%}
.nurse-table .assignments{max-width:none;gap:4px}
.nurse-table small{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.nurse-destination{padding:2px 0 7px;color:#315d75}
.nurse-name-input{font-size:15px;font-weight:700;min-width:0}
.nurse-help{padding:11px 18px;background:#fbfdfe}
.removal-preview{margin-bottom:0}

/* v1.8 — redimensionamento global, técnicos de apoio e funções na PCR. */
.resize-shortcut{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;box-shadow:0 7px 24px #10293e35;min-height:44px;font-size:14px}
.workspace{padding-bottom:90px}
.toast{bottom:82px}
.resize-options{border:0;padding:0;margin:0;display:grid;gap:10px;min-width:0}
.resize-options legend{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--ink)}
.resize-option{border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.resize-option.chosen{border-color:var(--teal);background:var(--teal-soft)}
.resize-option input{accent-color:var(--teal);width:18px;height:18px;flex:none;margin:2px 0 0}
.resize-option strong{font-size:14px;display:block}.resize-option small{display:block;font-size:13px;margin-top:4px;color:var(--muted)}
.modal .label-field{font-size:14px}.modal .control{font-size:16px;min-height:44px}
.support-list{display:grid;gap:12px}

<body>
  <div id="app"></div>
  <script>
/**
 * Motor de distribuição assistencial — protótipo local, sem dependências.
 * Todos os dados são fictícios até que o usuário os preencha.
 * As relações de proximidade são preferências informadas, NÃO distâncias aferidas.
 */
const POST_A = [201,202,203,204,205,206,207,208,220,221,222,223,224];
const POST_B = [209,210,211,212,214,215,216,217,218,219];
const ROOMS = [...POST_A, ...POST_B].sort((a,b) => a-b);
const BEDS = [...POST_A.map(n => ({room:n,post:'A'})), ...POST_B.map(n => ({room:n,post:'B'}))]
  .flatMap(item => ['A','B'].map(suffix => ({id:`${item.room}${suffix}`, ...item})));
const TRANSITION_A = [220,221,222,223];
const TRANSITION_B = [217,218,219];
const MAX_PATIENTS = 7;
const MAX_BATHS = 3;
const EXCEPTIONAL_MAX_BATHS = 4;
const CARE_WEIGHTS={baths:1300,bedridden:1500,surgicalPreps:1500,careLoad:1800};
// Escala 1 mantém seus leitos habituais (201 a 205) e pode receber
// pacientes EXTRAS exclusivamente dos leitos 223A/B e 224A/B.
const ESCALA_1_BASE_ROOMS = new Set([201,202,203,204,205]);
const ESCALA_1_BEDS = new Set(['223A','223B','224A','224B']);
const SHARED_ALLOWED_SLOTS = new Set([4,7]);
function techCount(staff) { return staff.filter(s => s.active && s.role !== 'nurse').length; }
function bathLimit(staff) { return techCount(staff) < 8 ? EXCEPTIONAL_MAX_BATHS : MAX_BATHS; }
function canUseSlot(bed,staff) { return staff?.slot !== 1 || ESCALA_1_BASE_ROOMS.has(Number(bed.id.slice(0,3))) || ESCALA_1_BEDS.has(bed.id); }

function staffPost(s) { return s.post === 'A' || s.post === 'B' ? s.post : ([1,2,3,4,9].includes(s.slot) ? 'A' : 'B'); }
function postAllowed(b,s) { return SHARED_ALLOWED_SLOTS.has(s.slot) || bedInfo(b.id).post === staffPost(s); }
function fugulinScore(b) { const n=Number(b.fugulin); return Number.isInteger(n)&&n>=9&&n<=36?n:null; }
function fugulinCategory(b) {
  const n=fugulinScore(b);
  return n===null?'Não informado':n<=14?'Cuidados mínimos':n<=20?'Cuidados intermediários':n<=26?'Alta dependência':n<=31?'Cuidados semi-intensivos':'Cuidados intensivos';
}
const FUGULIN_CATEGORIES=['Cuidados mínimos','Cuidados intermediários','Alta dependência','Cuidados semi-intensivos','Cuidados intensivos','Não informado'];

const HOME_ROOMS = {
  1:[201,202,203,204,205,223,224],
  2:[206,207,208,220,222,223,224],
  3:[220,221,222,223,224],
  4:[217,218,219,220,221,222,223],
  5:[209,218,219],
  6:[210,216,217],
  7:[211,212,214,215],
  8:[214,215,216,217,218,219],
  9:[217,218,219,220,221,222,223]
};

const bedroomById = new Map(BEDS.map(b => [b.id,b]));
function bedInfo(id) { return bedroomById.get(id); }
function bathApplies(bed, shift) {
  if (!bed || bed.status !== 'occupied') return false;
  if (bed.bath === 'yes') return true;
  if (bed.bath === 'no') return false;
  return (Number(bed.id.slice(0,3)) % 2 === 0) === (shift === 'day');
}
// Scheduling preference only: consider concurrent care demands together.
// This is independent of Fugulin and never changes eligibility or hard limits.
function careLoad(bed,shift) {
  if(bed.status!=='occupied')return 0;
  return Number(bathApplies(bed,shift))+Number(!!bed.bedridden)+Number(!!bed.surgicalPrep);
}
function canAttend(bed, staff) {
  return !!(staff?.active &&
    (!bed.bedridden || staff.canBedridden) &&
    (!bed.enteral || staff.canEnteral) &&
    canUseSlot(bed, staff) &&
    (!(bed.sexRestriction === 'female' || (!bed.sexRestriction && bed.womenOnly)) || (staff.sex || (staff.woman ? 'female' : 'male')) === 'female') &&
    (!(bed.sexRestriction === 'male') || (staff.sex || (staff.woman ? 'female' : 'male')) === 'male')); 
}

function buildDistances() {
  const graph = new Map(ROOMS.map(r => [r, []]));
  function link(a,b,w=1) { graph.get(a).push([b,w]); graph.get(b).push([a,w]); }
  [POST_A.slice(0,8), POST_A.slice(8), POST_B.slice(0,4), POST_B.slice(4)]
    .forEach(xs => { for (let i=0;i<xs.length-1;i++) link(xs[i],xs[i+1],1); });
  // Agrupamentos informados pelo usuário. Pesos relativos, não metros.
  [201,202,203,204,205].forEach((r,i)=>link(r, i<3 ? 224 : 223, 1.35));
  [[206,224],[207,223],[208,222],[208,220],[208,221],
   [209,218],[209,219],[210,216],[210,217],[212,214],[212,215]]
    .forEach(([a,b])=>link(a,b,1.05));
  // A região 217–223 é a faixa de transição; o custo é heurístico.
  link(219,220,2.2); link(218,221,2.4); link(217,222,2.8);
  const out = new Map();
  for (const start of ROOMS) {
    const dist = new Map(ROOMS.map(r=>[r,Infinity])); dist.set(start,0);
    const seen = new Set();
    for (let j=0;j<ROOMS.length;j++) {
      let v=null, best=Infinity;
      for (const r of ROOMS) if (!seen.has(r) && dist.get(r)<best) {best=dist.get(r);v=r;}
      if (v===null) break;
      seen.add(v);
      for (const [next,w] of graph.get(v)) if (dist.get(next)>best+w) dist.set(next,best+w);
    }
    out.set(start,dist);
  }
  return out;
}
const DISTANCES = buildDistances();
function dist(a,b) { return DISTANCES.get(a)?.get(b) ?? 12; }
function affinity(room, staff, zone) {
  const anchors = zone === 'S' ? [...TRANSITION_A,...TRANSITION_B] : (HOME_ROOMS[staff.slot] || []);
  const choices = anchors.filter(r=>zone==='S' || (zone==='A' ? POST_A.includes(r) : POST_B.includes(r)));
  const samePost = zone === 'A' ? POST_A : zone === 'B' ? POST_B : ROOMS;
  const target = choices.length ? choices : samePost;
  return Math.min(...target.map(r=>dist(room,r)));
}
function zoneCost(staff,zone) {
  const slot=staff.slot;
  const matrix={
    1:{A:0,B:35,S:15},2:{A:0,B:35,S:15},3:{A:0,B:20,S:7},
    4:{A:5,B:17,S:0},5:{A:35,B:0,S:15},6:{A:35,B:0,S:15},
    7:{A:35,B:0,S:2},8:{A:30,B:0,S:10},9:{A:12,B:10,S:0}
  };
  return matrix[slot]?.[zone] ?? 10;
}
function combinations(arr,k) {
  if(k===0)return [[]];
  if(k>arr.length)return [];
  const result=[];
  function walk(start,chosen) {
    if(chosen.length===k){result.push(chosen.slice());return;}
    for(let i=start;i<=arr.length-(k-chosen.length);i++){chosen.push(arr[i]);walk(i+1,chosen);chosen.pop();}
  }
  walk(0,[]);return result;
}
function planZones(staff,beds,shift,preserve,bathCap=3,allowPartial=false) {
  const n=staff.length;
  const techCount = staff.filter(s=>s.role!=='nurse').length;
  const odd = techCount % 2 === 1;
  const a=beds.filter(b=>bedInfo(b.id).post==='A').length;
  const b=beds.length-a;
  const bathA=beds.filter(x=>bedInfo(x.id).post==='A'&&bathApplies(x,shift)).length;
  const bathB=beds.filter(x=>bedInfo(x.id).post==='B'&&bathApplies(x,shift)).length;
  const mustShare = odd && a > 0 && b > 0;
  const minCross = mustShare && !allowPartial ? 1 : 0;
  const maxCross = mustShare ? Math.min(2,n) : 0; // Escala 4 e/ou 7, dois apenas quando um não comportar a ocupação
  const proposals=[];
  for(let sharedCount=minCross;sharedCount<=maxCross;sharedCount++) {
    for(const shared of combinations(staff.filter(s=>s.role!=='nurse'&&SHARED_ALLOWED_SLOTS.has(s.slot)),sharedCount)) {
      const remaining=staff.filter(s=>!shared.includes(s));
        const aN=remaining.filter(s=>staffPost(s)==='A').length,bN=remaining.length-aN;
        if(!allowPartial&&a>7*(aN+sharedCount)-(b>0?sharedCount:0))continue;
        if(!allowPartial&&b>7*(bN+sharedCount)-(a>0?sharedCount:0))continue;
        if(!allowPartial&&(bathA>bathCap*(aN+sharedCount)||bathB>bathCap*(bN+sharedCount)))continue;
        if(a<sharedCount || b<sharedCount)continue;
          const zones={};
          // All non-shared posts are fixed. Construct that one permitted
          // configuration directly instead of enumerating 2^teamSize subsets.
          staff.forEach(s=>zones[s.slot]=shared.includes(s)?'S':staffPost(s));
          let rating=staff.reduce((sum,s)=>sum+zoneCost(s,zones[s.slot]),0);
          rating+=sharedCount*(odd?8:12);
          rating+=Math.abs(aN-(n-sharedCount)*(a/(a+b||1)))*7;
          if (preserve?.assignment) {
            for (const s of shared) {
              const past=beds.filter(x=>preserve.assignment[x.id]===s.slot);
              if(new Set(past.map(x=>bedInfo(x.id).post)).size===2)rating-=9;
            }
          }
          proposals.push({zones,shared:shared.map(s=>s.slot),rating});
    }
  }
  proposals.sort((x,y)=>x.rating-y.rating);
  // Incluir alternativas de zonas para cobrir ausências e restrições individuais.
  const selected=[];
  const split = n<=5 ? [20,20,20] : (odd ? [20,40,30] : [45,0,0]);
  for(let i=0;i<=2;i++)selected.push(...proposals.filter(p=>p.shared.length===i).slice(0,split[i]));
  return selected;
}

class MinCostFlow {
  constructor(n){this.n=n;this.g=Array.from({length:n},()=>[]);}
  add(u,v,cap,cost){
    const a={to:v,rev:this.g[v].length,cap,cost,initial:cap};
    const b={to:u,rev:this.g[u].length,cap:0,cost:-cost,initial:0};
    this.g[u].push(a);this.g[v].push(b);return a;
  }
  solve(source,sink,required) {
    const pot=new Float64Array(this.n);
    let sent=0,total=0;
    while(sent<required) {
      const d=Array(this.n).fill(Infinity),pu=Array(this.n).fill(-1),pe=Array(this.n).fill(-1);
      const used=new Uint8Array(this.n);d[source]=0;
      for(let step=0;step<this.n;step++) {
        let v=-1,md=Infinity;
        for(let i=0;i<this.n;i++)if(!used[i]&&d[i]<md){md=d[i];v=i;}
        if(v===-1)break;
        used[v]=1;
        for(let j=0;j<this.g[v].length;j++){
          const e=this.g[v][j];if(e.cap===0)continue;
          const nd=d[v]+e.cost+pot[v]-pot[e.to];
          if(nd<d[e.to]-1e-8){d[e.to]=nd;pu[e.to]=v;pe[e.to]=j;}
        }
      }
      if(!Number.isFinite(d[sink]))break;
      for(let i=0;i<this.n;i++)if(Number.isFinite(d[i]))pot[i]+=d[i];
      let flow=required-sent;
      for(let v=sink;v!==source;v=pu[v])flow=Math.min(flow,this.g[pu[v]][pe[v]].cap);
      for(let v=sink;v!==source;v=pu[v]){
        const e=this.g[pu[v]][pe[v]];e.cap-=flow;this.g[v][e.rev].cap+=flow;
        total+=flow*e.cost;
      }
      sent+=flow;
    }
    return {sent,total};
  }
}
function chooseAnchors(plan,staff,beds,shift,variant,preserve,bathCap) {
  const assignments={};
  const counts=new Map(staff.map(s=>[s.slot,{patients:0,baths:0}]));
  const reserved=new Set();
  for(const slot of plan.shared) {
    const person=staff.find(s=>s.slot===slot);
    for(const post of (variant===2 ? ['B','A']:['A','B'])) {
      const transition = post==='A'?TRANSITION_A:TRANSITION_B;
      const groups=[];
      for(const room of (post==='A'?POST_A:POST_B)) {
        const options=beds.filter(x=>Number(x.id.slice(0,3))===room&&!reserved.has(x.id)&&canAttend(x,person));
        if(!options.length)continue;
        const roomDistance=Math.min(...transition.map(r=>dist(room,r)));
        const prevBonus=preserve?.assignment && options.some(x=>preserve.assignment[x.id]===slot)?-0.6:0;
        groups.push({room,options,rank:roomDistance+prevBonus});
      }
      groups.sort((x,y)=>x.rank-y.rank || x.room-y.room);
      // Diversificar os pontos de ancoragem sem perder a zona de transição.
      const best=groups.filter(g=>g.rank<=Math.max(2.8,(groups[0]?.rank??0)+1.5));
      const ordered=[...best.slice(variant%Math.max(best.length,1)),...best.slice(0,variant%Math.max(best.length,1)),...groups.filter(g=>!best.includes(g))];
      let found=false;
      for(const group of ordered) {
        const count=counts.get(slot);
        let choices=group.options;
        if(plan.shared.length>1 || variant===1)choices=choices.slice(0,1);
        let bath=choices.filter(x=>bathApplies(x,shift)).length;
        if(count.patients+choices.length>7||count.baths+bath>bathCap){
          choices=group.options.slice(0,1);bath=choices.filter(x=>bathApplies(x,shift)).length;
        }
        if(!choices.length||count.patients+choices.length>7||count.baths+bath>bathCap)continue;
        for(const x of choices){assignments[x.id]=slot;reserved.add(x.id);}
        count.patients+=choices.length;count.baths+=bath;
        found=true;break;
      }
      if(!found)return null;
    }
  }
  return {assignments,counts};
}
function solvePlan(plan,staff,beds,shift,variant,preserve,bathCap,allowPartial=false) {
  const anchored=chooseAnchors(plan,staff,beds,shift,variant,preserve,bathCap);
  if(!anchored)return null;
  const left=beds.filter(x=>!anchored.assignments[x.id]);
  const n=1+left.length+3*staff.length+1, source=0,sink=n-1;
  const flow=new MinCostFlow(n);
  const start=1+left.length;
  const sMap=new Map(staff.map((s,i)=>[s.slot,{
    bath:start+i*3,non:start+i*3+1,total:start+i*3+2
  }]));
  const links=[];
  for(let i=0;i<left.length;i++){
    const bed=left[i],info=bedInfo(bed.id),room=info.room;
    flow.add(source,i+1,1,0);
    for(const s of staff) {
      const zone=plan.zones[s.slot];
      if(zone!=='S'&&zone!==info.post)continue;
      if(!canAttend(bed,s)||!postAllowed(bed,s))continue;
      const slotNodes=sMap.get(s.slot);
      const bnode=bathApplies(bed,shift)?slotNodes.bath:slotNodes.non;
      let cost=Math.round(4.8*Math.min(affinity(room,s,zone),9));
      if(zone==='S' && !(TRANSITION_A.includes(room)||TRANSITION_B.includes(room)))cost+=15;
      if(preserve?.assignment)cost+=preserve.assignment[bed.id]===s.slot?0:38;
      if(bed.isolation && bed.isolation!=='none')cost+=1;
      // Desempate determinístico, sem dados pessoais.
      cost+=((room*7+s.slot*13+variant*3)%5);
      const edge=flow.add(i+1,bnode,1,cost);
      links.push({bed:bed.id,slot:s.slot,edge});
    }
  }
  for(const s of staff){
    const nodes=sMap.get(s.slot),current=anchored.counts.get(s.slot);
    const remain=7-current.patients;
    if(remain<0||current.baths>bathCap)return null;
    for(let j=current.baths;j<bathCap;j++)flow.add(nodes.bath,nodes.total,1,j<3?j*9:150);
    flow.add(nodes.non,nodes.total,7,0);
    for(let j=current.patients;j<7;j++)flow.add(nodes.total,sink,1,j*23);
  }
  const result=flow.solve(source,sink,left.length);
  if(result.sent!==left.length&&!allowPartial)return null;
  const assignment={...anchored.assignments};
  for(const link of links)if(link.edge.initial===1&&link.edge.cap===0)assignment[link.bed]=link.slot;
  return assignment;
}

function statistics(assignment,beds,staff,shift) {
  const active=staff.filter(s=>s.active);
  const rows=active.map(s=>({slot:s.slot,name:s.name||`Profissional ${s.slot}`,role:s.role,
    patients:0,baths:0,bedridden:0,surgicalPreps:0,careLoad:0,fugulinTotal:0,fugulinKnown:0,enteral:0,isolated:0,posts:{A:0,B:0},roomIds:new Set(),beds:[]}));
  const bySlot=new Map(rows.map(r=>[r.slot,r]));
  for(const b of beds.filter(x=>x.status==='occupied')) {
    const row=bySlot.get(Number(assignment[b.id]));
    if(!row)continue;
    const info=bedInfo(b.id);
    row.beds.push(b.id);row.patients++;
    if(fugulinScore(b)!==null){row.fugulinTotal+=fugulinScore(b);row.fugulinKnown++;}row.posts[info.post]++;row.roomIds.add(info.room);
    if(bathApplies(b,shift))row.baths++;
    if(b.bedridden)row.bedridden++;
    if(b.surgicalPrep)row.surgicalPreps++;
    row.careLoad+=careLoad(b,shift);
    if(b.enteral)row.enteral++;
    if(b.isolation && b.isolation!=='none')row.isolated++;
  }
  rows.forEach(r=>r.beds.sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true})));
  return rows;
}
function scoreAssignment(assignment,beds,staff,shift,preserve) {
  const rows=statistics(assignment,beds,staff,shift);
  if(!rows.length)return Infinity;
  let score=0;
  const counts=rows.map(r=>r.patients),max=Math.max(...counts),min=Math.min(...counts),mean=beds.length/rows.length;
  score+=Math.max(0,max-min-1)*850;
  score+=counts.reduce((t,x)=>t+(x-mean)**2,0)*100;
  const baths=rows.map(x=>x.baths),bmean=baths.reduce((a,b)=>a+b,0)/rows.length;
  // Care balance takes priority over room grouping and keeping old assignments.
  // Moves/swaps remain constrained to the same post and all hard rules.
  score+=baths.reduce((sum,x)=>sum+(x-bmean)**2,0)*CARE_WEIGHTS.baths;
  const eligibleBed=rows.filter(r=>staff.find(s=>s.slot===r.slot)?.canBedridden);
  if(eligibleBed.length){
    const m=eligibleBed.reduce((a,r)=>a+r.bedridden,0)/eligibleBed.length;
    score+=eligibleBed.reduce((a,r)=>a+(r.bedridden-m)**2,0)*CARE_WEIGHTS.bedridden;
  }
  const preps=rows.map(r=>r.surgicalPreps),pmean=preps.reduce((a,b)=>a+b,0)/rows.length;
  score+=preps.reduce((sum,n)=>sum+(n-pmean)**2,0)*CARE_WEIGHTS.surgicalPreps;
  const loads=rows.map(r=>r.careLoad),lmean=loads.reduce((a,b)=>a+b,0)/rows.length;
  score+=loads.reduce((sum,n)=>sum+(n-lmean)**2,0)*CARE_WEIGHTS.careLoad;
  for(const r of rows){
    const person=staff.find(s=>s.slot===r.slot);
    if(r.patients>0 && r.bedridden===r.patients && r.patients>1)score+=2500;
    score+=Math.max(0,r.baths-3)*220;
    if(r.slot===1 && r.patients===0)score+=12;
    score+=r.roomIds.size*3;
    const rooms=[...r.roomIds];
    for(let i=0;i<rooms.length;i++){
      const d=affinity(rooms[i],person,r.posts.A>0 &&r.posts.B>0?'S':r.posts.A>0?'A':'B');
      score+=Math.min(d,7)*2.5;
      for(let j=0;j<i;j++){
        const apart=dist(rooms[i],rooms[j]);
        score+=Math.max(0,apart-2)*3.1;
      }
    }
    if(r.posts.A&&r.posts.B){
      const disparity=Math.abs(r.posts.A-r.posts.B);
      score+=32+disparity*10+Math.max(0,disparity-1)*115;
      for(const id of r.beds){
        const room=bedInfo(id).room;
        if(!TRANSITION_A.includes(room)&&!TRANSITION_B.includes(room))score+=17;
      }
    }
    if(person && !person.canBedridden && r.patients < mean)score+=(mean-r.patients)*4;
  }
  const rooms=new Map();
  for(const b of beds) {
    const room=bedInfo(b.id).room;
    if(!rooms.has(room))rooms.set(room,new Set());
    rooms.get(room).add(assignment[b.id]);
  }
  for(const owners of rooms.values())score+=(owners.size-1)*54;
  if(preserve?.assignment) {
    for(const b of beds)if(preserve.assignment[b.id]!==assignment[b.id])score+=preserve.weight??55;
  }
  const shared=rows.filter(r=>r.posts.A&&r.posts.B).length;
  score+=Math.max(0,shared-1)*30;
  const complexity=rows.map(r=>r.fugulinTotal/36);
  const fm=complexity.reduce((a,b)=>a+b,0)/rows.length;
  const variance=complexity.reduce((a,b)=>a+(b-fm)**2,0);
  return score + 8 * variance/(1+variance);
}
function legalForZone(assignment,beds,staff,shift,zones,oddMandatory,bathCap){
  const rows=statistics(assignment,beds,staff,shift);
  if(rows.some(r=>r.patients>7||r.baths>bathCap))return false;
  for(const bed of beds){
    const s=staff.find(s=>s.slot===assignment[bed.id]);
    if(!canAttend(bed,s)||!postAllowed(bed,s))return false;
    if(zones[s.slot]!=='S'&&zones[s.slot]!==bedInfo(bed.id).post)return false;
  }
  const shared=rows.filter(r=>r.posts.A&&r.posts.B).length;
  if(shared>2 || (!oddMandatory&&shared>0) || (oddMandatory&&shared<1))return false;
  if(rows.some(r=>r.posts.A&&r.posts.B&&!SHARED_ALLOWED_SLOTS.has(r.slot)))return false;
  if(rows.some(r=>r.posts.A&&r.posts.B&&Math.abs(r.posts.A-r.posts.B)>1))return false;
  return true;
}
function cycleCareDelta(rows,outgoing,incoming,shift){
  let delta=0;
  for(let i=0;i<3;i++){
    const r=rows[i],from=outgoing[i],to=incoming[i];
    const changes={baths:Number(bathApplies(to,shift))-Number(bathApplies(from,shift)),
      bedridden:Number(!!to.bedridden)-Number(!!from.bedridden),
      surgicalPreps:Number(!!to.surgicalPrep)-Number(!!from.surgicalPrep),careLoad:careLoad(to,shift)-careLoad(from,shift)};
    for(const [key,weight]of Object.entries(CARE_WEIGHTS))delta+=((r[key]+changes[key])**2-r[key]**2)*weight;
    if(r.patients>1)delta+=((r.bedridden+changes.bedridden===r.patients?1:0)-(r.bedridden===r.patients?1:0))*2500;
  }
  return delta;
}
function localImprove(initial,beds,staff,shift,zones,preserve,bathCap) {
  let best={...initial},bestScore=scoreAssignment(best,beds,staff,shift,preserve);
  const techOdd=staff.filter(s=>s.role!=='nurse').length%2===1;
  const bothPosts=new Set(beds.map(b=>bedInfo(b.id).post)).size===2;
  const oddMandatory=techOdd&&bothPosts;
  const ordered=beds.slice().sort((a,b)=>a.id.localeCompare(b.id));
  // Permutas e realocações locais com verificação integral das restrições.
  for(let round=0;round<Math.max(12,beds.length);round++){
    let improvement=null,score=bestScore;
    const rows=statistics(best,beds,staff,shift),bySlot=new Map(rows.map(x=>[x.slot,x]));
    for(const bed of ordered){
      const src=best[bed.id];
      for(const s of staff){
        if(s.slot===src || !canAttend(bed,s))continue;
        if(zones[s.slot]!=='S'&&zones[s.slot]!==bedInfo(bed.id).post)continue;
        const destination=bySlot.get(s.slot);
        if(destination.patients>=7||destination.baths+(bathApplies(bed,shift)?1:0)>bathCap)continue;
        const temp={...best,[bed.id]:s.slot};
        if(!legalForZone(temp,beds,staff,shift,zones,oddMandatory,bathCap))continue;
        const v=scoreAssignment(temp,beds,staff,shift,preserve);
        if(v<score-0.001){score=v;improvement=temp;}
      }
    }
    // Trocas de pacientes preservam a quantidade de cada profissional.
    for(let i=0;i<ordered.length;i++)for(let j=i+1;j<ordered.length;j++){
      const a=ordered[i],b=ordered[j],sa=best[a.id],sb=best[b.id];
      if(sa===sb)continue;
      if(bedInfo(a.id).post!==bedInfo(b.id).post)continue;
      const pa=staff.find(s=>s.slot===sa),pb=staff.find(s=>s.slot===sb);
      if(!canAttend(a,pb)||!canAttend(b,pa))continue;
      if(zones[sa]!=='S'&&zones[sa]!==bedInfo(b.id).post)continue;
      if(zones[sb]!=='S'&&zones[sb]!==bedInfo(a.id).post)continue;
      const shiftA=(bathApplies(b,shift)?1:0)-(bathApplies(a,shift)?1:0);
      const shiftB=-shiftA;
      if(bySlot.get(sa).baths+shiftA>bathCap||bySlot.get(sb).baths+shiftB>bathCap)continue;
      const temp={...best,[a.id]:sb,[b.id]:sa};
      if(!legalForZone(temp,beds,staff,shift,zones,oddMandatory,bathCap))continue;
      const v=scoreAssignment(temp,beds,staff,shift,preserve);
      if(v<score-0.001){score=v;improvement=temp;}
    }
    // A third professional can bridge an otherwise impossible direct swap:
    // e.g. a bath from 2 goes to 3, a prep from 1 goes to 2, and a permitted
    // bed from 3 goes to 1. All three beds remain in their original post.
    if(!improvement){
      for(let i=0;i<ordered.length;i++)for(let j=i+1;j<ordered.length;j++)for(let k=j+1;k<ordered.length;k++){
        const outgoing=[ordered[i],ordered[j],ordered[k]],post=bedInfo(outgoing[0].id).post;
        if(outgoing.some(b=>bedInfo(b.id).post!==post))continue;
        const slots=outgoing.map(b=>best[b.id]);if(new Set(slots).size!==3)continue;
        const people=slots.map(slot=>staff.find(s=>s.slot===slot)),groupRows=slots.map(slot=>bySlot.get(slot));
        for(const incoming of [[outgoing[2],outgoing[0],outgoing[1]],[outgoing[1],outgoing[2],outgoing[0]]]){
          if(incoming.some((b,n)=>!canAttend(b,people[n])))continue;
          if(groupRows.some((r,n)=>r.baths+Number(bathApplies(incoming[n],shift))-Number(bathApplies(outgoing[n],shift))>bathCap))continue;
          if(cycleCareDelta(groupRows,outgoing,incoming,shift)>=-.001)continue;
          const temp={...best};incoming.forEach((b,n)=>temp[b.id]=slots[n]);
          if(!legalForZone(temp,beds,staff,shift,zones,oddMandatory,bathCap))continue;
          const v=scoreAssignment(temp,beds,staff,shift,preserve);
          if(v<score-.001){score=v;improvement=temp;}
        }
      }
    }
    if(!improvement)break;
    best=improvement;bestScore=score;
  }
  return {assignment:best,score:bestScore};
}

/**
 * Não inventa alocações que violam limite de 7, banho<=3/4 ou restrições.
 * A busca completa é a primeira tentativa. A distribuição parcial reaproveita
 * o fluxo máximo quando alguma restrição impede completar a escala.
 */
function generateCompleteSchedule(state,{preserve=false}={}) {
  const beds=state.beds.filter(b=>b.status==='occupied');
  const staff=state.staff.filter(s=>s.active);
  const shift=state.shift;
  const errors=[];
  if(!staff.length)errors.push('Não há profissionais ativos para distribuir os pacientes.');
  if(beds.length>staff.length*7)errors.push(`${beds.length} pacientes excedem a capacidade máxima de ${staff.length*7} com ${staff.length} profissionais.`);
  const bathTotal=beds.filter(b=>bathApplies(b,shift)).length;
  const cap=bathLimit(staff);
  if(bathTotal>staff.length*cap)errors.push(`${bathTotal} banhos previstos excedem o limite total de ${staff.length*cap} (${staff.length} profissionais × ${cap}).`);
  for(const b of beds)if(!staff.some(s=>canAttend(b,s)))errors.push(`Leito ${b.id}: nenhum profissional ativo atende a todas as restrições.`);
  if(errors.length)return {ok:false,errors};
  if(!beds.length)return {ok:true,assignment:{},score:0};
  const previously=preserve?{assignment:{...state.assignment},weight:80}:null;
  // Preferir rigidamente três banhos. Quarto banho é exceção se houver menos de 8 técnicos
  // e se não for encontrada solução completa com limite de três.
  for(const bathCap of (cap===4?[3,4]:[3])) {
    const plans=planZones(staff,beds,shift,previously,bathCap);
    let top=[];
    // Com número ímpar, preferir estritamente só uma Escala compartilhando;
    // recorrer a duas (4 e 7) apenas se nenhuma solução com uma for encontrada.
    const sharedGroups = plans.some(p=>p.shared.length) ? [1,2] : [0];
    for (const sharedCount of sharedGroups) {
    for(const plan of plans.filter(p=>p.shared.length===sharedCount)){
      for(let variant=0;variant<3;variant++){
        const solution=solvePlan(plan,staff,beds,shift,variant,previously,bathCap);
        if(!solution || validateSchedule(state,solution).errors.length)continue;
        const score=scoreAssignment(solution,beds,staff,shift,previously);
        top.push({assignment:solution,score:score+plan.rating*3,plan});
        top.sort((a,b)=>a.score-b.score);
        if(top.length>5)top.pop();
      }
    }
    if(top.length) break;
    }
    if(!top.length)continue;
    let chosen=top[0];
    for(const option of top.slice(0,3)){
      const updated=localImprove(option.assignment,beds,staff,shift,option.plan.zones,previously,bathCap);
      const combined=updated.score+option.plan.rating*3;
      if(combined<chosen.score)chosen={assignment:updated.assignment,score:combined,plan:option.plan};
    }
    return {ok:true,assignment:chosen.assignment,score:chosen.score,bathCap};
  }
  return {ok:false,errors:[
    `Não foi possível distribuir todos os pacientes respeitando as restrições: Escala 1 com leitos habituais 201–205 e extras apenas 223/224; com número ímpar somente a Escala 4 e/ou a Escala 7 dividem os postos; com número par ninguém divide; limite de 7 pacientes e ${cap} banhos.`,
    'A busca automática usa heurísticas; revise ocupação, restrições e cobertura antes de tentar novamente.'
  ]};

}

function distributionResult(state,assignment,contextErrors=[]) {
  const missing=state.beds.filter(b=>b.status==='occupied'&&!state.staff.some(s=>s.active&&s.slot===Number(assignment[b.id]))).map(b=>b.id);
  const checked=validateSchedule(state,assignment);
  return {ok:checked.errors.length===0,partial:missing.length>0,assignment,
    unassigned:missing,errors:checked.errors.length?[...new Set([...contextErrors,...checked.errors])]:[],warnings:checked.warnings};
}

function generatePartialSchedule(state,{preserve=false,errors=[]}={}) {
  const beds=state.beds.filter(b=>b.status==='occupied'),staff=state.staff.filter(s=>s.active);
  if(!staff.length)return distributionResult(state,{},errors);
  const previously=preserve?{assignment:state.assignment,weight:80}:null;
  const cap=bathLimit(staff);let best=null;
  for(const bathCap of (cap===4?[3,4]:[3])) {
    for(const plan of planZones(staff,beds,state.shift,previously,bathCap,true)) {
      for(let variant=0;variant<3;variant++) {
        const assignment=solvePlan(plan,staff,beds,state.shift,variant,previously,bathCap,true);
        if(!assignment)continue;
        // A partial flow can fill one side of a shared position first. Keep
        // the proportional part and leave excess beds available for review.
        for(const slot of plan.shared) {
          const sides=['A','B'].map(post=>beds.filter(b=>assignment[b.id]===slot&&bedInfo(b.id).post===post));
          const larger=sides[0].length>sides[1].length?sides[0]:sides[1];
          const smaller=Math.min(...sides.map(xs=>xs.length));
          for(const bed of larger.slice(smaller+1))delete assignment[bed.id];
        }
        const checked=validateSchedule(state,assignment,{partial:true});
        if(checked.errors.length)continue;
        const count=Object.keys(assignment).length;
        const ruleErrors=validateSchedule(state,assignment).errors.length-(beds.length-count);
        const assignedBeds=beds.filter(b=>assignment[b.id]);
        const score=scoreAssignment(assignment,assignedBeds,staff,state.shift,previously)+plan.rating*3;
        if(!best||count>best.count||(count===best.count&&(ruleErrors<best.ruleErrors||(ruleErrors===best.ruleErrors&&score<best.score))))best={assignment,count,ruleErrors,score,plan,bathCap};
      }
    }
  }
  if(!best)return distributionResult(state,{},errors);
  const missing=beds.filter(b=>!best.assignment[b.id]).map(b=>b.id);
  const filled=redistributeDepartingPatients({...state,assignment:best.assignment},missing);
  return {...distributionResult(state,filled.assignment,errors),score:best.score,bathCap:best.bathCap};
}

function generateSchedule(state,options={}) {
  const result=generateCompleteSchedule(state,options);
  if(result.ok)return {...result,partial:false,unassigned:[],errors:[]};
  return generatePartialSchedule(state,{...options,errors:result.errors});
}

// Only the explicitly supplied departing patient's beds may be assigned here.
// Every surviving professional keeps their existing patients, including any
// manual exceptions; those exceptions are reported for the nurse to review.
function redistributeDepartingPatients(state,patientIds) {
  const beds=state.beds.filter(b=>b.status==='occupied'),staff=state.staff.filter(s=>s.active);
  const base=Object.fromEntries(Object.entries(state.assignment||{}).filter(([id,slot])=>beds.some(b=>b.id===id)&&staff.some(s=>s.slot===Number(slot))));
  const pending=beds.filter(b=>patientIds.includes(b.id)&&!base[b.id]);
  const cap=bathLimit(staff),odd=techCount(staff)%2===1;
  const rows=statistics(base,beds,staff,state.shift),bySlot=new Map(rows.map(r=>[r.slot,r]));
  pending.sort((a,b)=>staff.filter(s=>canAttend(a,s)).length-staff.filter(s=>canAttend(b,s)).length||a.id.localeCompare(b.id));
  let best={...base},bestCount=-1,complete=false,visited=0;
  const originalShared=rows.filter(r=>r.posts.A&&r.posts.B).length;
  const current={...base},changed=new Set(),memo=new Set();
  function validChangedRows() {
    for(const slot of changed) {
      const row=bySlot.get(slot),person=staff.find(s=>s.slot===slot),home=staffPost(person);
      if(row.patients>7||row.baths>cap)return false;
      if(row.posts[home==='A'?'B':'A']&&!row.posts[home])return false;
      if(row.posts.A&&row.posts.B&&(!odd||!SHARED_ALLOWED_SLOTS.has(slot)||person.role==='nurse'||Math.abs(row.posts.A-row.posts.B)>1))return false;
    }
    return rows.filter(r=>r.posts.A&&r.posts.B).length<=Math.max(2,originalShared);
  }
  function search(index,assigned) {
    // A manually edited departing position can contain far more than seven
    // beds. Bound the search so this recovery action stays usable on tablets.
    if(complete||++visited>50000||assigned+pending.length-index<=bestCount)return;
    if(index===pending.length) {
      if(validChangedRows()){best={...current};bestCount=assigned;if(assigned===pending.length)complete=true;}
      return;
    }
    const key=index+'|'+rows.map(r=>`${r.patients},${r.baths},${r.posts.A},${r.posts.B}`).join('|');
    if(memo.has(key))return;memo.add(key);
    const bed=pending[index],post=bedInfo(bed.id).post,bath=Number(bathApplies(bed,state.shift));
    const choices=staff.filter(s=>{
      const row=bySlot.get(s.slot);
      return canAttend(bed,s)&&row.patients<7&&row.baths+bath<=cap&&
        (post===staffPost(s)||(odd&&SHARED_ALLOWED_SLOTS.has(s.slot)&&s.role!=='nurse'));
    }).sort((a,b)=>{
      const x=bySlot.get(a.slot),y=bySlot.get(b.slot);
      return (x.patients*20+x.baths*8+x.bedridden*8+affinity(bedInfo(bed.id).room,a,staffPost(a)))-
        (y.patients*20+y.baths*8+y.bedridden*8+affinity(bedInfo(bed.id).room,b,staffPost(b)));
    });
    for(const person of choices) {
      const row=bySlot.get(person.slot),wasChanged=changed.has(person.slot);
      current[bed.id]=person.slot;row.patients++;row.baths+=bath;row.bedridden+=Number(!!bed.bedridden);row.posts[post]++;changed.add(person.slot);
      search(index+1,assigned+1);
      delete current[bed.id];row.patients--;row.baths-=bath;row.bedridden-=Number(!!bed.bedridden);row.posts[post]--;if(!wasChanged)changed.delete(person.slot);
      if(complete)return;
    }
    search(index+1,assigned);
  }
  search(0,0);
  return {...distributionResult(state,best),preserved:true};
}

function validateSchedule(state,assignment=state.assignment,{manual=false,partial=false}={}) {
  const errors=[],warnings=[];
  const occupied=state.beds.filter(b=>b.status==='occupied');
  const active=state.staff.filter(s=>s.active);
  for(const b of occupied){
    const slot=assignment[b.id],s=active.find(x=>x.slot===Number(slot));
    if(!s){(partial?warnings:errors).push(`Leito ${b.id} não possui profissional ativo atribuído.`);continue;}
    if(!postAllowed(b,s))errors.push(`Leito ${b.id}: Escala ${s.slot} pertence ao Posto ${staffPost(s)}. Somente Escalas 4 e 7 podem atender outro posto.`);
    if(!canAttend(b,s))errors.push(`Leito ${b.id} atribuído à Escala ${s.slot}, que possui restrição incompatível (sexo, competências ou limite de leitos extras da Escala 1).`);
  }
  const rows=statistics(assignment,occupied,active,state.shift);
  const cap=bathLimit(active);
  rows.forEach(r=>{
    const person=active.find(s=>s.slot===r.slot);
    if(SHARED_ALLOWED_SLOTS.has(r.slot)&&r.patients>0&&!r.posts[staffPost(person)])errors.push(`Escala ${r.slot} pertence ao Posto ${staffPost(person)}. Atender o outro posto só é permitido no compartilhamento autorizado com equipe ímpar.`);
    if(r.patients>7)errors.push(`Escala ${r.slot} tem ${r.patients} pacientes (máximo: 7).`);
    if(r.baths>cap)errors.push(`Escala ${r.slot} tem ${r.baths} banhos (máximo permitido: ${cap}).`);
    if(r.baths>3)warnings.push(`Escala ${r.slot} tem ${r.baths} banhos: ${techCount(active)<8?'exceção à regra de 3 banhos (com menos de 8 técnicos).':'acima da regra de 3 banhos (com 8 ou mais técnicos).'}`);
    if(r.patients>1&&r.bedridden===r.patients)warnings.push(`Escala ${r.slot} ficou exclusivamente com pacientes acamados.`);
    if(r.baths>=3&&r.bedridden>=3)warnings.push(`Escala ${r.slot} acumula ${r.baths} banhos, ${r.bedridden} acamados e ${r.surgicalPreps} preparos cirúrgicos. Conferir a carga de cuidados e as restrições do posto.`);
    if(r.posts.A&&r.posts.B&&Math.abs(r.posts.A-r.posts.B)>1)errors.push(`Escala ${r.slot} compartilha postos sem proporcionalidade: ${r.posts.A} pacientes no A e ${r.posts.B} no B (diferença máxima permitida: 1).`);
  });
  const shared=rows.filter(r=>r.posts.A&&r.posts.B);
  if(shared.length>2)errors.push(`${shared.length} profissionais dividem os postos (máximo automático: 2).`);
  if(shared.some(r=>!SHARED_ALLOWED_SLOTS.has(r.slot)))errors.push('Na geração automática, somente a Escala 4 ou a Escala 7 pode dividir os Postos A e B.');
  if(shared.some(r=>r.role==='nurse'))errors.push('A divisão de postos deve ser realizada por técnico, não pelo enfermeiro de cobertura.');
  const tech=active.filter(s=>s.role!=='nurse').length;
  const across=new Set(occupied.map(b=>bedInfo(b.id).post)).size===2;
  if(tech%2===0&&shared.length)errors.push('Com número par de técnicos, é proibido compartilhar os Postos A e B.');
  if(tech%2===1&&across&&!shared.some(r=>state.staff.find(s=>s.slot===r.slot)?.role!=='nurse'))(partial?warnings:errors).push('Com número ímpar de técnicos, pelo menos um técnico deve dividir os Postos A e B.');
  if(tech<7){
    const substitutes=active.filter(s=>s.role==='nurse'||s.role==='support').length;
    if(active.length<7)warnings.push(`Equipe abaixo do mínimo habitual: ${tech} técnicos/apoios ativos e ${active.length} profissionais no total. Acionar enfermeiro de cobertura ou técnico de apoio.`);
    else if(substitutes)warnings.push('Cobertura excepcional com profissional de apoio ou enfermeiro; confirmar designação e responsabilidades.');
  }
  if(rows.length){
    const mx=Math.max(...rows.map(x=>x.patients)),mn=Math.min(...rows.map(x=>x.patients));
    if(mx-mn>1)warnings.push(`Diferença de ${mx-mn} pacientes entre profissionais (${mn} a ${mx}). Rever proporcionalidade.`);
  }
  for(const bed of state.beds.filter(x=>x.status!=='occupied')){
    if(assignment[bed.id])warnings.push(`Leito ${bed.id} não está ocupado, mas consta na escala: atualizar a distribuição.`);
  }
  // A edição manual é deliberadamente livre, inclusive para ultrapassar metas,
  // dividir postos ou atribuir outro território. Não oculta os riscos: converte
  // conflitos em alertas e exige conferência do responsável pelo plantão.
  if(manual) return {errors:[],warnings:[...errors.map(x=>`Exceção manual — ${x}`),...warnings],stats:rows,overrides:errors};
  return {errors,warnings,stats:rows,overrides:[]};
}

const NURSE_IDS = ['A', 'A2', 'B', 'B2', 'AB'];
const MAX_TEAM_MEMBERS = BEDS.length;
function nurseCount(value) { return [2,3,4].includes(Number(value)) ? Number(value) : 4; }
function nurseRoles(value) {
  const count=nurseCount(value);
  if(count===2) return [{id:'A',post:'A',label:'Enfermeiro A'},{id:'B',post:'B',label:'Enfermeiro B'}];
  if(count===3) return [{id:'A',post:'A',label:'Enfermeiro A'},{id:'B',post:'B',label:'Enfermeiro B'},{id:'AB',post:'AB',label:'Enfermeiro AB'}];
  return [{id:'A',post:'A',label:'Enfermeiro A1'},{id:'A2',post:'A',label:'Enfermeiro A2'},
    {id:'B',post:'B',label:'Enfermeiro B1'},{id:'B2',post:'B',label:'Enfermeiro B2'}];
}
function nurseNames(value) {
  return Object.fromEntries(NURSE_IDS.map(id=>[id,typeof value?.[id]==='string'?value[id].slice(0,85):'']));
}
function groupedBeds(ids) {
  const rooms=new Map();
  for(const id of new Set(ids)) {
    if(!bedInfo(id)) continue;
    const room=id.slice(0,3);
    if(!rooms.has(room)) rooms.set(room,new Set());
    rooms.get(room).add(id.slice(3));
  }
  return [...rooms].sort(([a],[b])=>Number(a)-Number(b)).map(([room,suffixes])=>room+[...suffixes].sort().join(''));
}

// Find the largest readable scale that fits the complete measured content.
// measure receives the unscaled width, so line wrapping is included in fitting.
function printScaleForPage(width,height,measure) {
  const fits=scale=>{const size=measure(width/scale);return size.height*scale<=height&&size.width*scale<=width+.5;};
  if(fits(1))return 1;
  let low=.001,high=1;
  for(let i=0;i<16;i++){
    const candidate=(low+high)/2;
    if(fits(candidate))low=candidate;else high=candidate;
  }
  return low;
}

// One occupied bed and one vacant bed each count as one place to cover.
// Thus a nurse with more possible admissions receives fewer current patients.
// Keep rooms together when the difference in coverage is at most two places.
function generateNurseAssignment(beds,value,overrides={}) {
  const count=nurseCount(value),roles=nurseRoles(count);
  const eligible=beds.filter(b=>bedInfo(b.id)&&['occupied','vacant'].includes(b.status));
  const byId=new Map(eligible.map(b=>[b.id,b]));
  const orderA=count===3?[201,202,203,204,205,206,207,208,224,223,222,221,220]
    :[201,202,203,204,205,224,223,206,207,208,220,221,222];
  const orderB=[209,210,211,212,214,215,216,217,218,219];
  const ordered=rooms=>rooms.flatMap(room=>['A','B'].map(s=>`${room}${s}`)).filter(id=>byId.has(id));
  const a=ordered(orderA),b=ordered(orderB),assignment={};
  const splitPenalty=(ids,cut)=>cut>0&&cut<ids.length&&ids[cut-1].slice(0,3)===ids[cut].slice(0,3)?100:0;
  const spread=loads=>{const mean=loads.reduce((x,y)=>x+y,0)/loads.length;const excess=Math.max(0,Math.max(...loads)-Math.min(...loads)-2);return excess**2*10000+loads.reduce((s,n)=>s+(n-mean)**2,0)*20;};
  if(count===2) {a.forEach(id=>assignment[id]='A');b.forEach(id=>assignment[id]='B');}
  if(count===4) {
    for(const [ids,first,second] of [[a,'A','A2'],[b,'B','B2']]) {
      let best=Infinity,cut=0;
      for(let i=0;i<=ids.length;i++) {
        const score=spread([i,ids.length-i])+splitPenalty(ids,i);
        if(score<best){best=score;cut=i;}
      }
      ids.forEach((id,i)=>assignment[id]=i<cut?first:second);
    }
  }
  if(count===3) {
    const usualA=a.filter(id=>Number(id.slice(0,3))<=208).length;
    const usualB=b.filter(id=>Number(id.slice(0,3))<=216).length;
    let best=Infinity,cutA=0,cutB=0;
    for(let i=0;i<=a.length;i++) for(let j=0;j<=b.length;j++) {
      const loads=[i,j,a.length+b.length-i-j];
      const noShared=a.length>1&&b.length>1&&((i===a.length)||(j===b.length))?2:0;
      const score=spread(loads)+splitPenalty(a,i)+splitPenalty(b,j)+noShared
        +Math.abs(i-usualA)*.1+Math.abs(j-usualB)*.1;
      if(score<best){best=score;cutA=i;cutB=j;}
    }
    a.forEach((id,i)=>assignment[id]=i<cutA?'A':'AB');
    b.forEach((id,i)=>assignment[id]=i<cutB?'B':'AB');
  }
  for(const [id,roleId] of Object.entries(overrides||{})) {
    const role=roles.find(r=>r.id===roleId);
    if(byId.has(id)&&role&&(role.post==='AB'||role.post===bedInfo(id).post)) assignment[id]=roleId;
  }
  return assignment;
}

// Fill gaps with the last active professional, retaining each position's post.
// slotMap follows people, so their patients are never silently given to another
// person just because the position numbers changed.
function normalizeStaffSlots(staff) {
  const next=staff.map(s=>({...s}));
  const origin=new Map(next.filter(s=>s.active).map(s=>[s.slot,s.slot]));
  const count=origin.size;
  for(let slot=1;slot<=count;slot++) {
    const destination=next.find(s=>s.slot===slot);
    if(!destination||destination.active)continue;
    const last=next.filter(s=>s.active).sort((a,b)=>b.slot-a.slot)[0];
    const destinationIndex=next.indexOf(destination),lastIndex=next.indexOf(last);
    next[destinationIndex]={...last,slot,post:destination.post};
    next[lastIndex]={...destination,slot:last.slot,post:last.post};
    origin.set(slot,origin.get(last.slot));origin.delete(last.slot);
  }
  return {staff:next,slotMap:Object.fromEntries([...origin].map(([slot,oldSlot])=>[oldSlot,slot]))};
}

function remapAssignment(assignment,slotMap) {
  return Object.fromEntries(Object.entries(assignment||{})
    .filter(([,slot])=>slotMap[Number(slot)]!==undefined)
    .map(([id,slot])=>[id,slotMap[Number(slot)]]));
}

// The last active professional fills the departing position. All removal
// entry points use this same operation, including the presence checkbox.
function remapStaffAfterRemoval(staff,removedSlot) {
  const next=staff.map(s=>({...s})),removed=next.find(s=>s.slot===removedSlot&&s.active);
  if(!removed) return {...normalizeStaffSlots(next),replacementSlot:null};
  const last=next.filter(s=>s.active).sort((a,b)=>b.slot-a.slot)[0];
  removed.active=false;
  return {...normalizeStaffSlots(next),replacementSlot:last.slot===removedSlot?null:last.slot,
    replacementName:last.name,removedName:removed.name};
}

// A returning professional keeps their profile. A new professional fills the
// next position, creating it when all the existing positions are already used.
function addStaffMember(staff,details,{existingSlot=null}={}) {
  const active=staff.filter(s=>s.active);
  if(active.length>=MAX_TEAM_MEMBERS)return {ok:false,error:'A equipe já possui um profissional para cada leito do setor.'};
  if(!details.name?.trim())return {ok:false,error:'Preencha o nome do técnico que está entrando.'};
  if(!['A','B'].includes(details.post))return {ok:false,error:'Selecione o posto de referência do novo técnico.'};
  if(!['female','male'].includes(details.sex))return {ok:false,error:'Informe o sexo do profissional para conferir as restrições dos pacientes.'};
  const next=staff.map(s=>({...s}));
  let person=existingSlot?next.find(s=>s.slot===Number(existingSlot)&&!s.active):next.find(s=>s.slot===active.length+1&&!s.active);
  if(existingSlot&&!person)return {ok:false,error:'Esse profissional já está presente ou não está cadastrado.'};
  if(!person){person={slot:active.length+1};next.push(person);}
  const sourceSlot=person.slot;
  Object.assign(person,{name:details.name.trim().slice(0,85),role:existingSlot&&['tech','support','nurse'].includes(person.role)?person.role:'tech',post:details.post,sex:details.sex,
    woman:details.sex==='female',canBedridden:details.canBedridden!==false,canEnteral:details.canEnteral!==false,
    pcrRole:['A','B','C','D'].includes(details.pcrRole)?details.pcrRole:'',duty:'',active:true});
  const normalized=normalizeStaffSlots(next);
  // A newly added position has the explicitly selected reference post.
  const addedSlot=normalized.slotMap[sourceSlot];
  normalized.staff.find(s=>s.slot===addedSlot).post=details.post;
  normalized.staff.sort((a,b)=>a.slot-b.slot);
  return {ok:true,...normalized,addedSlot};
}

function printedBeds(ids){
  const groups=new Map();
  for(const id of ids){const bed=state.beds.find(b=>b.id===id);const suffix=(bed?.isolation!=='none'?'*':'')+(bed?.surgicalPrep?' (PC)':'');if(!groups.has(suffix))groups.set(suffix,[]);groups.get(suffix).push(id);}
  return [...groups].flatMap(([suffix,list])=>groupedBeds(list).map(id=>id+suffix))
    .sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b)).join(' · ')||'—';
}

function fitPrintSheet(){
  const sheet=$('#print-sheet');if(!sheet)return;
  const content=sheet.querySelector('.print-content');if(!content)return;
  // Leave a physical reserve inside A4 landscape; only the complete measured
  // sheet is scaled. CSS transform keeps screen and print layout consistent.
  sheet.style.width='280mm';sheet.style.height='190mm';
  const width=(sheet.clientWidth||280*96/25.4)-3,height=(sheet.clientHeight||190*96/25.4)-6;
  sheet.style.setProperty('--print-scale','1');sheet.style.setProperty('--print-row-extra','0px');
  const measure=naturalWidth=>{content.style.width=`${naturalWidth}px`;return {width:Math.max(content.scrollWidth||0,content.offsetWidth||naturalWidth),height:Math.max(content.scrollHeight,content.offsetHeight||0)};};
  const scale=Math.floor(printScaleForPage(width,height,measure)*100000)/100000;
  content.style.width=`${width/scale}px`;
  const rows=content.querySelectorAll('.sheet-tech tbody tr').length,spare=height/scale-content.scrollHeight;
  if(spare>0&&rows)sheet.style.setProperty('--print-row-extra',`${Math.min(3,spare/(rows*2))}px`);
  if(content.scrollHeight*scale>height)sheet.style.setProperty('--print-row-extra','0px');
  sheet.style.setProperty('--print-scale',String(scale));
}

          </div>

function removePerson(slot,reason,mode='all'){

  record('Saída de profissional e redimensionamento',`Escala ${slot} · ${s.name} · ${reason} · ${mode==='departing'?'Somente pacientes de quem saiu':'Redistribuição automática'}${moved.replacementSlot?` · Escala ${moved.replacementSlot} assume a ${slot}`:''}`);

  state.staff=moved.staff;

}
